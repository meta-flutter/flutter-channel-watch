# Watch the Flutter stable channel and tell the things that depend on it.
#
# Two signals, because they are two different things. bin/internal/engine.version
# is the engine SRCREV the flutter-engine builds take. meta-flutter pins
# FLUTTER_SDK_TAG to a version string resolved out of releases_linux.json. The
# engine can move without a release existing in the feed the layer reads, and a
# roll dispatched on an engine SHA has no version to pin.
#
# No change is a green no-op. The previous version made it `echo | false`, so a
# healthy watcher was red on almost every run and a dead one looked identical --
# which is how this sat disabled for four and a half months without anyone
# noticing. Red here means something is actually wrong.

name: stable-channel-watch

on:
  schedule:
    # Best effort on GitHub's side; treat it as "about every 15 minutes".
    - cron: "*/15 * * * *"
  workflow_dispatch:

# A slow API call must not let one run overlap the next and double-dispatch.
concurrency:
  group: stable-channel-watch
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  watch:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Read the channel
        id: read
        run: |
          set -euo pipefail

          # Never write a state file straight from the network. `wget -O` truncates
          # the destination before it knows whether the request succeeded, so a 404
          # or a storage blip leaves the file empty or holding an HTML error page --
          # which reads as a change and dispatches builds with a garbage srcrev.
          # Fetch to a temporary file, validate, and only then move it into place.
          curl --fail --show-error --silent --retry 3 --retry-delay 5 --max-time 30 \
            -o engine.new \
            https://raw.githubusercontent.com/flutter/flutter/stable/bin/internal/engine.version
          if ! grep -Eq '^[0-9a-f]{40}$' engine.new; then
            echo "::error::engine.version is not a sha1: $(head -c 120 engine.new)"
            exit 1
          fi

          curl --fail --show-error --silent --retry 3 --retry-delay 5 --max-time 60 \
            -o releases.json \
            https://storage.googleapis.com/flutter_infra_release/releases/releases_linux.json
          # jq, not a python heredoc: a heredoc terminator cannot be indented,
          # and everything in a YAML block scalar is.
          version=$(jq -r \
            '.current_release.stable as $h | .releases[] | select(.hash == $h) | .version' \
            releases.json | head -1)
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::stable version is not x.y.z: $version"
            exit 1
          fi

          engine=$(cat engine.new)
          echo "engine=$engine" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

          engine_changed=false
          version_changed=false
          [ -f stable ]         && [ "$(cat stable)" = "$engine" ]          || engine_changed=true
          [ -f stable-version ] && [ "$(cat stable-version)" = "$version" ] || version_changed=true
          echo "engine_changed=$engine_changed" >> "$GITHUB_OUTPUT"
          echo "version_changed=$version_changed" >> "$GITHUB_OUTPUT"

          echo "engine.version  $engine  (changed: $engine_changed)"
          echo "stable release  $version  (changed: $version_changed)"

          # State is written in "Record the check", after the dispatches. Writing
          # it here is what lost 3.47.6 and 3.47.7: the version was committed,
          # the dispatch then failed, and every later run saw no change.
          rm -f releases.json

      - name: Dispatch flutter-engine
        id: engine
        if: steps.read.outputs.engine_changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.WORKFLOW }}
          SRCREV: ${{ steps.read.outputs.engine }}
        run: |
          # Not -e: one architecture failing must not skip the other two.
          set -uo pipefail
          # -f, not -F. -F adds a *typed* parameter, so it sent JSON true to an
          # input declared without a type, which is a string whose default is
          # 'false', and the API answered
          #
          #   gh: Invalid value for input 'release' (HTTP 422)
          #
          # That is what broke on 1 and 9 October.
          failed=''
          for arch in x86_64 arm64 armv7hf; do
            echo "dispatching flutter-engine-$arch for $SRCREV"
            gh api --method POST \
              "repos/meta-flutter/flutter-engine/actions/workflows/flutter-engine-$arch.yaml/dispatches" \
              -f ref=main \
              -f "inputs[srcrev]=$SRCREV" \
              -f "inputs[release]=true" || failed="$failed $arch"
          done
          if [ -n "$failed" ]; then
            echo "::error::dispatch failed for:$failed"
            exit 1
          fi

      - name: Dispatch the meta-flutter roll
        id: roll
        # Two signals, two dispatches: an engine failure must not take this with
        # it. Without !cancelled() a failed step above skips this one, which is
        # how a 422 on an engine input stopped a release from being rolled.
        if: ${{ !cancelled() && steps.read.outputs.version_changed == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.WORKFLOW }}
          VERSION: ${{ steps.read.outputs.version }}
        run: |
          set -euo pipefail
          # Held back until the roll could be trusted to run unattended. It can
          # now: it fails rather than exiting 0 with recipes missing, skips apps
          # the pinned SDK cannot satisfy and says why, and regenerates the
          # SDK's own app recipes. See meta-flutter/meta-flutter#864.
          #
          # The version goes with the dispatch because the roll needs the SDK it
          # is rolling *to* on PATH before it runs -- an app that vendors its pub
          # cache resolves its lockfile against it -- and that is not knowable
          # from inside the roll until the pin has already moved.
          #
          # This stages a draft pull request. Nothing merges on its own.
          echo "dispatching a meta-flutter roll to $VERSION"
          gh api --method POST \
            "repos/meta-flutter/meta-flutter/dispatches" \
            -f event_type=flutter-stable-roll \
            -f "client_payload[version]=$VERSION"

      - name: Record the check
        # Always. A failed dispatch still has to leave a heartbeat: GitHub
        # disables a scheduled workflow after 60 days without repository
        # activity, and a watch whose last-checked is stale is a dead watch.
        if: ${{ !cancelled() }}
        env:
          ENGINE: ${{ steps.read.outputs.engine }}
          VERSION: ${{ steps.read.outputs.version }}
          ENGINE_CHANGED: ${{ steps.read.outputs.engine_changed }}
          VERSION_CHANGED: ${{ steps.read.outputs.version_changed }}
          ENGINE_OUTCOME: ${{ steps.engine.outcome }}
          ROLL_OUTCOME: ${{ steps.roll.outcome }}
          READ_OUTCOME: ${{ steps.read.outcome }}
        run: |
          set -euo pipefail

          # A read that failed has no outputs, so writing state from them would
          # truncate both files and the next run would see a change from empty
          # to current and dispatch on it. Heartbeat only.
          if [ "$READ_OUTCOME" != "success" ]; then
            echo "::warning::channel read $READ_OUTCOME; recording the heartbeat only"
          else
            # A signal is recorded once its dispatch is out, or when it did not
            # change. A dispatch that failed leaves the old value, so the next
            # run 15 minutes later tries again instead of treating the release
            # as handled. outcome is 'skipped' only when nothing changed.
            if [ "$ENGINE_CHANGED" != "true" ] || [ "$ENGINE_OUTCOME" = "success" ]; then
              printf '%s\n' "$ENGINE" > stable
            else
              echo "::warning::engine dispatch $ENGINE_OUTCOME; leaving stable at $(cat stable)"
            fi

            if [ "$VERSION_CHANGED" != "true" ] || [ "$ROLL_OUTCOME" = "success" ]; then
              printf '%s\n' "$VERSION" > stable-version
            else
              echo "::warning::roll dispatch $ROLL_OUTCOME; leaving stable-version at $(cat stable-version)"
            fi
          fi

          state_changed=false
          git add stable stable-version
          git diff --cached --quiet -- stable stable-version || state_changed=true

          # The heartbeat is one commit a day, not one every 15 minutes.
          today=$(date -u +%Y-%m-%d)
          heartbeat=false
          if [ ! -f last-checked ] || [ "$(cut -c1-10 last-checked)" != "$today" ]; then
            heartbeat=true
          fi
          date -u +%Y-%m-%dT%H:%M:%SZ > last-checked

          if [ "$state_changed" = true ] || [ "$heartbeat" = true ]; then
            git config user.name "Joel Winarske"
            git config user.email "joel.winarske@gmail.com"
            git add last-checked
            # From the files, not the outputs: the message has to say what was
            # recorded, which is not what was read when a dispatch failed.
            git commit -m "Roll: engine $(cat stable), stable $(cat stable-version)"
            git push
          else
            git checkout -- stable stable-version last-checked
            echo "no change, and already recorded today"
          fi
